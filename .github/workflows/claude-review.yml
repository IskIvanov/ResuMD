name: Claude Review

# Runs only when someone adds the `claude-review` label to a pull request.
# Adding a label needs triage or write access, and claude-code-action checks
# that whoever triggered it has write access, so outsiders can't start it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# One review per pull request at a time; a new label click cancels the old run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code review
    # Only for our label, and only for branches in this repository: GitHub
    # gives fork pull requests no secrets, and the action skips them anyway.
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness. The PR branch is
            checked out in the current directory. Read AGENTS.md first: its
            conventions (architecture layers, naming, no ternaries, JSDoc,
            errors with `cause`, tests first) are rules to check against.

            Look for real bugs the change adds: wrong behaviour, missed edge
            cases, broken error handling, tests that don't test what they
            claim, and broken AGENTS.md rules. Skip style nits the formatter
            handles. Only report findings you can explain with a concrete
            failure scenario.

            Post each finding as an inline comment on the line it concerns
            with `mcp__github_inline_comment__create_inline_comment`
            (`confirmed: true`), starting with its severity: **Critical**,
            **Important** or **Nit**. Then post one summary with
            `gh pr comment`, headed "Claude code review", that lists the
            findings by severity, or says that none were found. Only post
            GitHub comments; don't reply with review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Takes the label off when the review finishes, so adding it again re-runs
  # it, e.g. after you push fixes.
  remove-label:
    name: Remove label
    needs: [code-review]
    if: always() && github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      # Labels on a pull request go through the issues API.
      issues: write
      pull-requests: write
    steps:
      - run: >-
          gh api --method DELETE
          "repos/$REPO/issues/$PR_NUMBER/labels/claude-review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
