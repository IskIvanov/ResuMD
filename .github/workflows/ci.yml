name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the Bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test
        run: bunx vitest run
      - name: Typecheck
        run: bun run typecheck
      - name: Format
        run: bun run format:check
