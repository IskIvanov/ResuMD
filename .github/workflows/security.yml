name: Security

on:
  # Every pull request, including ones from forks, on open and on each push.
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action comments on the PR line that holds a leak.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so gitleaks scans every commit the PR adds.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the Bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Lists every known advisory; fails the check when there is one.
      - name: Audit
        run: bun audit
